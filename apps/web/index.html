<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YanChess</title>
    <!-- Synchronous theme detection: runs before CSS/JS to prevent flash of wrong theme -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme = stored === 'dark' || stored === 'light'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          document.documentElement.dataset.theme = theme;
        } catch (_) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Synchronous language detection: runs before React to prevent flash of wrong language -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('yanchess:lang');
          var lang = stored
            ? stored
            : (navigator.language.indexOf('ru') === 0 ? 'ru'
              : navigator.language.indexOf('es') === 0 ? 'es'
              : 'en');
          if (!stored) localStorage.setItem('yanchess:lang', lang);
          document.documentElement.lang = lang;
        } catch (_) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
