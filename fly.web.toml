# fly.web.toml — deployed with: fly deploy -c fly.web.toml
# Build context is repo root so Dockerfile can access the full monorepo.

app            = "yanchess"
primary_region = "fra"

[build]
  dockerfile = "apps/web/Dockerfile"
  ignorefile = ".dockerignore"

  [build.args]
    VITE_API_URL = "https://api.yan-chess.com/api/v1"

[http_service]
  internal_port        = 80
  force_https          = true
  auto_stop_machines   = "stop"
  auto_start_machines  = true
  min_machines_running = 0

[[vm]]
  memory   = "256mb"
  cpu_kind = "shared"
  cpus     = 1
