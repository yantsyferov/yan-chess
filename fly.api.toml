# fly.api.toml — deployed with: fly deploy -c fly.api.toml
# Build context is repo root so Dockerfile can access the full monorepo.

app            = "yanchess-api"
primary_region = "fra"

[build]
  dockerfile = "apps/api/Dockerfile"
  ignorefile = ".dockerignore"

[env]
  NODE_ENV = "production"
  PORT     = "3000"

[deploy]
  # Applies pending Prisma migrations before Fly rolls new machines.
  # Fly aborts the deploy (old machines stay) if this exits non-zero,
  # so a bad migration never ships broken code to prod.
  #
  # Command notes:
  # - prisma CLI lives in apps/api/dependencies after the spec-011 cleanup,
  #   so pnpm deploy --prod now copies it into /app/node_modules/.bin/prisma.
  # - WORKDIR is /app (flat layout — pnpm deploy flattened the workspace),
  #   so schema is auto-discovered at ./prisma/schema.prisma.
  release_command = "node_modules/.bin/prisma migrate deploy"

[http_service]
  internal_port       = 3000
  force_https         = true
  auto_stop_machines  = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    path         = "/api/v1/health"
    interval     = "15s"
    timeout      = "5s"
    grace_period = "10s"
    method       = "GET"

[[vm]]
  memory   = "512mb"
  cpu_kind = "shared"
  cpus     = 1
