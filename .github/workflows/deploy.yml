name: Deploy to Fly.io

# Runs ONLY on push to main (direct push or merged PR).
# PR-time safety is covered by ci.yml.
on:
  push:
    branches: [main]
    # Doc-only / spec-only commits do not change the Docker image byte-wise,
    # so skip the deploy for them. A commit that touches BOTH code and docs
    # still triggers (GitHub Actions uses OR semantics across the diff).
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "context/**"
      - ".gitignore"
      - "LICENSE"

concurrency:
  # Only one deploy at a time per branch. New pushes queue — do NOT cancel
  # in-flight deploys because Fly deploy is a destructive external action.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Phase 1 — same checks as PR CI, repeated here as safety net on main.
  verify:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @yanchess/shared build
      - run: pnpm typecheck
      - run: pnpm --filter api test:unit
      - run: pnpm --filter web test -- --run

  # Phase 2 — deploy API + web in parallel after verify passes.
  # Prisma migrations are NOT applied here — release_command is disabled
  # (see BACKLOG.md "Prisma CLI absent from runtime image"). Run manually from
  # laptop before merging a PR that touches apps/api/prisma/migrations/.
  deploy-api:
    name: Deploy API to Fly
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        # --remote-only builds the Docker image on Fly's remote builder
        # instead of this GitHub runner — faster + avoids pulling base images
        # into the runner.
        run: flyctl deploy --config fly.api.toml --remote-only

  deploy-web:
    name: Deploy Web to Fly
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --config fly.web.toml --remote-only
