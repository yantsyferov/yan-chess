name: CI

# Runs on every PR + push to any branch EXCEPT main.
# Push-to-main is handled by deploy.yml which runs the same checks first.
on:
  pull_request:
  push:
    branches-ignore: [main]

concurrency:
  # If the same branch gets a new push, cancel the previous in-flight CI run.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        # --frozen-lockfile fails if pnpm-lock.yaml is out of sync with package.json
        # — catches "forgot to commit the lockfile" bugs.
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        # apps/api + apps/web import from @yanchess/shared which is a tsc build.
        # typecheck below will fail without this.
        run: pnpm --filter @yanchess/shared build

      - name: Typecheck
        run: pnpm typecheck

      - name: API unit tests
        run: pnpm --filter api test:unit

      - name: Web tests
        run: pnpm --filter web test -- --run
